<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#09080b">
  <title>SUKI</title>
  <meta name="description" content="SUKI">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Share+Tech+Mono&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      color-scheme: dark;
      --bg: #09080b;
      --line: rgba(255, 255, 255, .10);
      --text: #f4f2f4;
      --muted: #89858d;
      --accent: #c94b59;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% -20%, rgba(126, 35, 49, .16), transparent 52%),
        radial-gradient(ellipse at 90% 75%, rgba(91, 48, 68, .07), transparent 40%),
        var(--bg);
      color: var(--text);
      font-family: 'Space Grotesk', sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .shell {
      width: min(960px, calc(100% - 40px));
      margin: 0 auto;
    }

    header {
      height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 800;
      letter-spacing: .19em;
    }

    .mark {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      border: 1px solid rgba(201, 75, 89, .35);
      border-radius: 9px;
      color: #d87881;
      font-size: 15px;
      background: linear-gradient(145deg, rgba(255,255,255,.12), rgba(255,255,255,.025));
      box-shadow: inset 0 1px rgba(255,255,255,.17), 0 0 18px rgba(160,48,65,.08);
      backdrop-filter: blur(12px);
    }

    .nav {
      display: flex;
      align-items: center;
      color: var(--muted);
      font: 10px 'DM Mono', monospace;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .nav a {
      transition: color .2s ease;
    }

    .nav a:hover {
      color: var(--text);
    }

    main {
      min-height: calc(100vh - 76px);
      display: grid;
      place-items: center;
      padding: 80px 0;
    }

    .hero {
      width: 100%;
      text-align: center;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 8px 13px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255,255,255,.035);
      color: #b4afb7;
      font: 10px 'DM Mono', monospace;
      letter-spacing: .13em;
      text-transform: uppercase;
      box-shadow: inset 0 1px rgba(255,255,255,.08);
      backdrop-filter: blur(14px);
    }

    h1 {
      margin: 28px 0 14px;
      font-size: clamp(68px, 13vw, 116px);
      line-height: .92;
      letter-spacing: -.095em;
      font-weight: 800;
    }

    h1 span {
      background: linear-gradient(180deg, #fff 8%, #e3dce0 55%, #a69aa2 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 8px 28px rgba(255,255,255,.07));
    }

    .intro {
      max-width: 440px;
      margin: 0 auto;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.85;
    }

    .actions {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-top: 30px;
      flex-wrap: wrap;
    }

    .button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 43px;
      padding: 0 17px;
      border-radius: 11px;
      font-size: 11px;
      font-weight: 700;
      transition: transform .2s ease, border-color .2s ease, background .2s ease, box-shadow .2s ease;
      backdrop-filter: blur(14px);
    }

    .button:hover {
      transform: translateY(-2px);
    }

    .primary {
      color: white;
      border: 1px solid rgba(255,255,255,.22);
      background: linear-gradient(145deg, #bd4b59, #963541);
      box-shadow: inset 0 1px rgba(255,255,255,.24), 0 5px 20px rgba(120,35,48,.16);
    }

    .primary:hover {
      border-color: rgba(255,255,255,.35);
      background: linear-gradient(145deg, #ce5967, #a13a49);
      box-shadow: inset 0 1px rgba(255,255,255,.3), 0 7px 25px rgba(120,35,48,.24);
    }

    .secondary {
      color: #d8d5da;
      border: 1px solid rgba(255,255,255,.12);
      background: linear-gradient(145deg, rgba(255,255,255,.085), rgba(255,255,255,.025));
      box-shadow: inset 0 1px rgba(255,255,255,.10), 0 6px 20px rgba(0,0,0,.12);
    }

    .secondary:hover {
      border-color: rgba(201,75,89,.35);
      background: rgba(255,255,255,.075);
    }

    @media (max-width: 560px) {
      .shell {
        width: calc(100% - 32px);
      }

      header {
        height: 68px;
      }

      main {
        min-height: calc(100vh - 68px);
        padding: 80px 0;
      }

      .intro {
        font-size: 13px;
      }
    }
  </style>
</head>

<body>
  <header class="shell">
    <a class="brand" href="#">
      <span class="mark">猫</span>
      <span>SUKI</span>
    </a>
  </header>

  <main class="shell">
    <section class="hero">
      <div class="eyebrow">text here</div>

      <h1><span>suki.</span></h1>

      <p class="intro">text here</p>

      <div class="actions">
        <a class="button primary" href="https://discord.com" target="_blank" rel="noopener">
          Add to Discord <span>↗</span>
        </a>

        <a class="button secondary" href="https://discord.com" target="_blank" rel="noopener">
          Join the Discord <span>↗</span>
        </a>
      </div>
    </section>
  </main>
</body>
</html>
